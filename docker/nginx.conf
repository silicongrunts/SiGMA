server {
    listen 3000;
    server_name _;

    client_max_body_size 0;

    root /app/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # noVNC browser client — served by uvicorn (backend/app/static/), not
    # the frontend dist. Without this, `location /` falls through to the
    # React SPA and the VNC iframe shows a blank screen.
    location = /vnc.html {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /novnc/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # nginx 1.22's bundled mime.types has no .mjs mapping, so module workers
    # (pdfjs-dist v6 ships pdf.worker.min-*.mjs) fall back to default_type
    # application/octet-stream, which browsers refuse to execute as a module
    # script. Serve .mjs as JavaScript explicitly.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
