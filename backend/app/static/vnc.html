<!DOCTYPE html>
<html>
<head><title>SiGMA Browser</title>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#000}#screen{width:100vw;height:100vh}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#9ca3af;font:14px sans-serif;z-index:10}
#overlay .spin{width:36px;height:36px;border:3px solid #374151;border-top-color:#6fa8dc;border-radius:50%;animation:vncspin .8s linear infinite}
#overlay .err{display:none;color:#f87171;max-width:80vw;text-align:center;line-height:1.5}
#overlay a{display:none;color:#6fa8dc;cursor:pointer;text-decoration:underline}
@keyframes vncspin{to{transform:rotate(360deg)}}
</style>
</head>
<body><div id="screen"></div>
<div id="overlay">
  <div class="spin"></div>
  <div id="overlay-text">Connecting&hellip;</div>
  <div id="overlay-err" class="err"></div>
  <a id="overlay-retry">Reconnect</a>
</div>
<script type="module">
const params = new URLSearchParams(location.search);
const wsPath = params.get('ws') || '/api/v1/browser/default/vnc';
const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = wsProto + '//' + location.host + wsPath;
// Covers the whole journey — WS, RFB handshake, and the wait for the first
// painted frame. RFB 'connect' only means the handshake is done; no pixel
// has arrived at that point (cold starts can sit on a black root while
// Chrome paints).
const CONNECT_TIMEOUT_MS = 30000;
// A downscaled sample whose darkest and brightest luma differ by at least
// this counts as real content; the bare X root is uniform black.
const CONTENT_CONTRAST = 8;

import RFB from './novnc/core/rfb.js';
let rfb;
let connectTimer = null;
let frameWatchRaf = null;

const overlay = document.getElementById('overlay');
const spinEl = overlay.querySelector('.spin');
const textEl = document.getElementById('overlay-text');
const errEl = document.getElementById('overlay-err');
const retryEl = document.getElementById('overlay-retry');

// The embedding React app listens for these to sync its status dot and
// overlays; same-origin in both dev (vite proxy) and prod (uvicorn).
// 'connecting' → handshake in progress, 'loading' → handshake done, waiting
// for the first frame, 'connected' → pixels on screen.
function notifyParent(status, message) {
  if (window.parent !== window) {
    try { window.parent.postMessage({ source: 'sigma-vnc', status, message }, window.location.origin); } catch { /* parent gone */ }
  }
}

function cancelFrameWatch() {
  if (frameWatchRaf !== null) {
    cancelAnimationFrame(frameWatchRaf);
    frameWatchRaf = null;
  }
}

function showConnecting() {
  clearTimeout(connectTimer);
  cancelFrameWatch();
  spinEl.style.display = 'block';
  errEl.style.display = 'none';
  retryEl.style.display = 'none';
  textEl.textContent = 'Connecting…';
  overlay.style.display = 'flex';
}

function fail(message) {
  clearTimeout(connectTimer);
  cancelFrameWatch();
  spinEl.style.display = 'none';
  textEl.textContent = '';
  errEl.textContent = message;
  errEl.style.display = 'block';
  retryEl.style.display = 'inline';
  overlay.style.display = 'flex';
  notifyParent('error', message);
}

// Stay under the overlay until actual pixels show up: sample a downscaled
// copy of the noVNC canvas and look for contrast. The bare X root is uniform
// black, Chrome's window is not — so the overlay can never announce a screen
// that is still empty.
function watchFirstFrame() {
  textEl.textContent = 'Loading screen…';
  notifyParent('loading');
  const off = document.createElement('canvas');
  off.width = 48;
  off.height = 27;
  const octx = off.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    const canvas = document.querySelector('#screen canvas');
    if (canvas && canvas.width > 0) {
      try {
        octx.drawImage(canvas, 0, 0, off.width, off.height);
        const d = octx.getImageData(0, 0, off.width, off.height).data;
        let min = 255;
        let max = 0;
        for (let i = 0; i < d.length; i += 4) {
          const luma = (d[i] + d[i + 1] + d[i + 2]) / 3;
          if (luma < min) min = luma;
          if (luma > max) max = luma;
        }
        if (max - min >= CONTENT_CONTRAST) {
          frameWatchRaf = null;
          clearTimeout(connectTimer);
          overlay.style.display = 'none';
          notifyParent('connected');
          return;
        }
      } catch { /* canvas not paintable yet */ }
    }
    frameWatchRaf = requestAnimationFrame(tick);
  };
  frameWatchRaf = requestAnimationFrame(tick);
}

function connect() {
  const div = document.getElementById('screen');
  div.innerHTML = '';
  // A retry while the previous attempt is stuck mid-handshake must detach
  // it, or its eventual unclean disconnect would fail the new session.
  if (rfb) { try { rfb.disconnect(); } catch { /* already gone */ } }
  showConnecting();
  notifyParent('connecting');

  rfb = new RFB(div, wsUrl);
  rfb.scaleViewport = true;
  rfb.background = '#000';
  rfb.addEventListener('connect', watchFirstFrame);
  rfb.addEventListener('disconnect', (e) => {
    if (!e.detail.clean) {
      fail(e.detail.detail || 'Connection lost.');
    }
  });
  connectTimer = setTimeout(() => fail('Connection timed out. The browser may not be ready.'), CONNECT_TIMEOUT_MS);
}

retryEl.addEventListener('click', (e) => { e.preventDefault(); connect(); });
connect();
</script>
</body>
</html>
